services:
  - type: web
    name: ingredientsight-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: SERVER_HOST
        value: 0.0.0.0
      # NOTE: Render automatically injects PORT for web services — no need
      # to declare it here (server.py reads PORT from the environment).
